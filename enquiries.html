<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enquiries | Apex Tuitions</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --apex-navy: #0A192F;
      --apex-navy-dark: #070F1E;
      --royal-blue: #2563EB;
      --apex-gold: #F59E0B;
      --emerald: #10B981;
      --emerald-light: #ECFDF5;
      --bg-slate: #F8FAFC;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --card-radius: 16px;
      --btn-radius: 8px;
      --shadow-card: 0 12px 32px -4px rgba(10, 25, 47, 0.08);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(10, 25, 47, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 28px;
      border-bottom: 3.5px solid var(--apex-gold);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .header-wrap {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }
    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      object-fit: cover;
      border: 2px solid #ffffff;
    }
    .brand-text h1 {
      font-size: 21px;
      color: #ffffff;
      font-weight: 800;
      line-height: 1;
    }
    .nav-links-desktop {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      color: #CBD5E1;
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      padding: 8px 16px;
      border-radius: 8px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link:hover, .nav-link.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .enquiries-container {
      max-width: 880px;
      margin: 32px auto 56px;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .enquiries-card {
      background: #ffffff;
      border-radius: var(--card-radius);
      border: 1px solid var(--border-subtle);
      padding: 32px;
      box-shadow: var(--shadow-card);
    }

    .enquiry-item-box {
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: var(--bg-slate);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      transition: var(--transition);
    }
    .enquiry-item-box:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .enquiry-item-box.confirmed {
      background: #F0FDF4;
      border-color: #86EFAC;
    }
    .enquiry-status-tag {
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 14px;
      display: inline-block;
    }
    .enquiry-status-tag.pending { background: #FEF3C7; color: #92400E; }
    .enquiry-status-tag.confirmed { background: #DCFCE7; color: #166534; }
    .enquiry-status-tag.completed { background: #E2E8F0; color: #334155; }

    .btn-action-accept {
      background: var(--emerald); color: #ffffff; border: none; padding: 8px 16px; border-radius: var(--btn-radius); font-size: 12.5px; font-weight: 800; cursor: pointer; transition: var(--transition);
    }
    .btn-action-accept:hover { background: #059669; }
    .btn-action-reject {
      background: #E2E8F0; color: #475569; border: none; padding: 8px 16px; border-radius: var(--btn-radius); font-size: 12.5px; font-weight: 800; cursor: pointer; transition: var(--transition);
    }
    .btn-action-reject:hover { background: #CBD5E1; }
    .btn-action-end {
      background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; padding: 8px 16px; border-radius: var(--btn-radius); font-size: 12.5px; font-weight: 800; cursor: pointer; transition: var(--transition);
    }
    .btn-action-end:hover { background: #FCA5A5; }
    .btn-action-chat {
      background: #25D366; color: #ffffff; text-decoration: none; padding: 8px 16px; border-radius: var(--btn-radius); font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);
    }
    .btn-action-chat:hover { background: #20BA5A; }

    .mobile-bottom-dock { display: none; }

    @media (max-width: 768px) {
      body.logged-in-mobile { padding-bottom: 92px !important; }
      body.logged-in-mobile .mobile-bottom-dock {
        display: grid !important;
        grid-template-columns: 1.15fr 1fr 1fr;
        gap: 8px;
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        background: #FFFFFF;
        padding: 8px 10px;
        border-radius: 16px;
        border: 1.5px solid #CBD5E1;
        box-shadow: 0 8px 24px rgba(10, 25, 47, 0.16);
        z-index: 9999;
        align-items: center;
      }
      .dock-btn {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        padding: 10px 4px; border-radius: 10px; text-decoration: none; font-size: 11px;
        font-weight: 800; line-height: 1.2; text-align: center; border: 1.5px solid #CBD5E1;
        background: #FFFFFF; color: #0A192F; position: relative;
      }
      .dock-btn.dock-btn-primary { background: #0A192F; color: #FFFFFF; border-color: #0A192F; }
      .dock-btn.dock-btn-primary i { color: #FFFFFF; font-size: 13px; }
      .dock-btn-label-stacked { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .dock-badge {
        position: absolute; top: -5px; right: -4px; background: #EF4444; color: #FFFFFF;
        font-size: 9.5px; font-weight: 800; border-radius: 10px; padding: 1px 5px;
      }
      .enquiries-card { padding: 20px 16px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="header-wrap">
    <a href="index.html" class="brand-group">
      <img src="apex-circle-logo.png" alt="Apex Logo" class="header-logo" onerror="this.onerror=null; this.src='logo.png';">
      <div class="brand-text">
        <h1>APEX TUITIONS</h1>
      </div>
    </a>
    
    <nav class="nav-links-desktop">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse.html" class="nav-link">Browse</a>
      <a href="resources.html" class="nav-link">Resources</a>
      <a href="profile.html" class="nav-link">My Profile</a>
    </nav>
  </div>
</header>

<main class="enquiries-container">
  <section class="enquiries-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="font-size:20px;color:var(--apex-navy);font-weight:800;">Tuition Enquiries & Confirmation</h3>
        <p style="font-size:13px;color:var(--text-muted);margin-top:2px;">Showing active Pending, Confirmed, and Ended tuitions.</p>
      </div>
      <button onclick="loadUserEnquiries()" style="border:none;background:none;color:var(--royal-blue);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
    
    <div id="enquiriesList">
      <p style="font-size:13px;color:var(--text-muted);">Loading enquiries...</p>
    </div>
  </section>
</main>

<!-- THREE BUTTONS PERSISTENT BOTTOM DOCK (Mobile Only) -->
<nav class="mobile-bottom-dock" id="mobileBottomDock">
  <a href="enquiries.html" class="dock-btn dock-btn-primary">
    <i class="fa-solid fa-clipboard-list"></i>
    <span>Enquiries</span>
    <span class="dock-badge hidden" id="dockEnquiryBadge">0</span>
  </a>

  <a href="profile.html" class="dock-btn">
    <i class="fa-solid fa-user" style="color: #6366F1;"></i>
    <div class="dock-btn-label-stacked">
      <span>View My</span>
      <span>Profile</span>
    </div>
  </a>

  <a href="browse.html" class="dock-btn">
    <i class="fa-solid fa-magnifying-glass" style="color: #0284C7;"></i>
    <div class="dock-btn-label-stacked">
      <span>Browse</span>
      <span id="dockBrowseLabel">Teachers</span>
    </div>
  </a>
</nav>

<script>
const SUPABASE_URL = "https://agxoxrtetmcfwbpzyypo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneG94cnRldG1jZndicHp5eXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjg2MDIsImV4cCI6MjEwMjcwNDYwMn0.ASD3Sv83YCdwQURKYsuORWgBnSj37vXlz7EIEMFC3u0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let currentRole = null;

function cleanKey(val) {
  return String(val || "").trim().toLowerCase().replace(/[^a-z0-9]/g, '');
}

async function loadUserEnquiries() {
  const container = document.getElementById("enquiriesList");
  container.innerHTML = `<p style="font-size:13px;color:var(--text-muted);">Loading enquiries...</p>`;

  const currentUserId = String(currentUser.id || "").trim();
  const currentMobile = cleanKey(currentProfile?.mobile);

  const { data, error } = await db
    .from("enquiries")
    .select("*")
    .order("created_at", { ascending: false });

  if (error || !data || !data.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px 10px;color:var(--text-muted);font-size:13.5px;">
        <i class="fa-solid fa-inbox" style="font-size:32px;color:#CBD5E1;margin-bottom:12px;display:block;"></i>
        No active enquiries found.
      </div>
    `;
    return;
  }

  const myEnquiries = data.filter(enq => {
    const sId = String(enq.sender_id || "").trim();
    const rId = String(enq.recipient_id || "").trim();
    const sMob = cleanKey(enq.sender_mobile);
    const rMob = cleanKey(enq.recipient_mobile);

    return (sId === currentUserId) || (rId === currentUserId) ||
           (currentMobile && (sMob === currentMobile || rMob === currentMobile));
  });

  const pendingCount = myEnquiries.filter(e => e.recipient_id === currentUserId && e.status === 'Pending').length;
  const dBadge = document.getElementById("dockEnquiryBadge");
  if (dBadge) {
    if (pendingCount > 0) {
      dBadge.textContent = pendingCount;
      dBadge.classList.remove("hidden");
    } else {
      dBadge.classList.add("hidden");
    }
  }

  if (!myEnquiries.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px 10px;color:var(--text-muted);font-size:13.5px;">
        <i class="fa-solid fa-inbox" style="font-size:32px;color:#CBD5E1;margin-bottom:12px;display:block;"></i>
        No active enquiries found.
      </div>
    `;
    return;
  }

  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

  container.innerHTML = myEnquiries.map(enq => {
    const sId = String(enq.sender_id || "").trim();
    const rId = String(enq.recipient_id || "").trim();
    const isIncoming = (rId === currentUserId) || (cleanKey(enq.recipient_mobile) === currentMobile);

    const counterpartName = isIncoming ? enq.sender_name : enq.recipient_name;
    const counterpartPhone = isIncoming ? enq.sender_mobile : enq.recipient_mobile;
    const cleanPhone = (counterpartPhone || '').replace(/[^0-9]/g, '');
    const waPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
    const status = enq.status || 'Pending';

    // 30-day timeline calculation
    let timelineNote = "";
    if (status === 'Confirmed' && enq.confirmed_at) {
      const confTime = new Date(enq.confirmed_at).getTime();
      const eligibleTime = new Date(confTime + THIRTY_DAYS_MS);
      const daysPassed = Math.floor((Date.now() - confTime) / (1000 * 60 * 60 * 24));
      
      timelineNote = `
        <div style="font-size:11.5px;color:#047857;margin-top:4px;font-weight:700;">
          📅 Day ${daysPassed}/30 Completed • Eligible for Star badge credit on ${eligibleTime.toLocaleDateString("en-GB")}
        </div>
      `;
    } else if (status === 'Completed') {
      const confTime = new Date(enq.confirmed_at || enq.created_at).getTime();
      const endTime = new Date(enq.ended_at || Date.now()).getTime();
      const isSuccessful = (endTime - confTime) >= THIRTY_DAYS_MS;
      timelineNote = `
        <div style="font-size:11.5px;color:${isSuccessful ? '#166534' : '#64748b'};margin-top:4px;font-weight:700;">
          ${isSuccessful ? '⭐ Completed 30+ days (Counted as Successful Tuition)' : 'Ended before 30 days (Not counted towards Stars)'}
        </div>
      `;
    }

    return `
      <div class="enquiry-item-box ${status.toLowerCase()}">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span class="enquiry-status-tag ${status.toLowerCase()}">${status}</span>
            <span style="font-size:11.5px;color:#94A3B8;font-weight:600;">${isIncoming ? 'Incoming Request' : 'Sent by You'}</span>
          </div>
          <b style="font-size:16px;color:var(--apex-navy);">${counterpartName || 'Tuition Member'}</b>
          <div style="font-size:13px;color:var(--royal-blue);font-weight:700;margin-top:2px;">Subject: ${enq.subject || 'All Subjects'}</div>
          <div style="font-size:12px;color:#64748B;margin-top:2px;">WhatsApp: ${counterpartPhone || 'Direct'}</div>
          ${timelineNote}
        </div>

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          ${isIncoming && status === 'Pending' ? `
            <button class="btn-action-accept" onclick="updateEnquiryStatus('${enq.id}', 'Confirmed')">
              <i class="fa-solid fa-check"></i> Accept & Confirm
            </button>
            <button class="btn-action-reject" onclick="updateEnquiryStatus('${enq.id}', 'Rejected')">
              <i class="fa-solid fa-xmark"></i> Reject
            </button>
          ` : ''}

          ${status === 'Confirmed' ? `
            <span style="font-size:12px;font-weight:800;color:#166534;background:#DCFCE7;padding:6px 12px;border-radius:6px;">✓ Tuition Confirmed</span>
            <button class="btn-action-end" onclick="updateEnquiryStatus('${enq.id}', 'Completed')">
              End Tuition
            </button>
          ` : ''}

          ${waPhone ? `
            <a href="https://wa.me/${waPhone}" target="_blank" class="btn-action-chat">
              <i class="fa-brands fa-whatsapp"></i> Chat
            </a>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function updateEnquiryStatus(enquiryId, newStatus) {
  const updates = { status: newStatus };
  if (newStatus === 'Confirmed') {
    updates.confirmed_at = new Date().toISOString();
  } else if (newStatus === 'Completed') {
    updates.ended_at = new Date().toISOString();
  }

  const { error } = await db.from("enquiries").update(updates).eq("id", enquiryId);
  if (error) {
    alert("Error updating status: " + error.message);
  } else {
    loadUserEnquiries();
  }
}

window.addEventListener("load", async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return window.location.replace("index.html?auth=login");
  currentUser = session.user;

  document.body.classList.add("logged-in-mobile");

  const { data: t } = await db.from("teachers").select("*").eq("id", currentUser.id).maybeSingle();
  if (t) {
    currentProfile = t;
    currentRole = 'teacher';
  } else {
    const { data: s } = await db.from("students").select("*").eq("id", currentUser.id).maybeSingle();
    currentProfile = s;
    currentRole = 'student';
  }

  const dockBrowseLabel = document.getElementById("dockBrowseLabel");
  if (dockBrowseLabel) {
    dockBrowseLabel.textContent = (currentRole === 'teacher') ? "Students" : "Teachers";
  }

  loadUserEnquiries();
});
</script>
  <script src="mobile-layout-fix.js"></script>
</body>
</html>
