<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Admin Tracker - Apex Tuitions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    padding: 16px 12px;
  }
  .hidden { display: none !important; }

  /* PIN Gate */
  #gateOverlay {
    position: fixed;
    inset: 0;
    background: #0A192F;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 99999;
  }
  .gate-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .gate-card input {
    width: 100%;
    height: 42px;
    font-size: 18px;
    letter-spacing: 5px;
    text-align: center;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    margin: 12px 0;
    font-family: monospace;
  }
  .gate-btn {
    width: 100%;
    height: 40px;
    background: #2563EB;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Admin Content */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 16px;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    padding: 10px;
    border-radius: 8px;
    text-align: center;
  }
  .stat-blue { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .stat-green { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .stat-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .stat-box b { font-size: 20px; display: block; }
  .stat-box span { font-size: 10px; font-weight: 800; text-transform: uppercase; }

  #statusAlert {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
    font-weight: 600;
    display: none;
  }

  .table-wrap {
    overflow-x: auto;
    width: 100%;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 600px;
  }
  th {
    background: #0A192F;
    color: #ffffff;
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid #f1f5f9;
  }
  .badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
  }
  .badge-confirmed { background: #dcfce7; color: #166534; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-other { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>

<!-- PIN Gate Modal -->
<div id="gateOverlay">
  <div class="gate-card">
    <h2 style="margin-bottom:4px;">🔒 Apex Admin Login</h2>
    <p style="font-size:12px;color:#64748b;">Enter PIN to access tracker console</p>
    <input type="password" id="pinInput" placeholder="••••" maxlength="10" autofocus onkeydown="if(event.key==='Enter') submitPin()">
    <button class="gate-btn" onclick="submitPin()">Enter Console</button>
    <p id="gateErr" style="color:#ef4444;font-size:11.5px;margin-top:8px;display:none;">Invalid PIN code</p>
  </div>
</div>

<!-- Main Admin Panel -->
<div class="container hidden" id="adminPanel">
  <div class="header-bar">
    <h2 style="font-size:16px;">Apex Tuition & Enquiries Tracker</h2>
    <div style="display:flex;gap:6px;">
      <button onclick="loadData()" style="padding:6px 12px;background:#0A192F;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">Refresh</button>
      <button onclick="logoutAdmin()" style="padding:6px 12px;background:#dc2626;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">Lock</button>
      <a href="index.html" style="padding:6px 12px;background:#64748b;color:#fff;border-radius:6px;font-size:12px;text-decoration:none;">Home</a>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box stat-blue">
      <b id="cntTotal">0</b>
      <span>Total Contacts</span>
    </div>
    <div class="stat-box stat-green">
      <b id="cntConfirmed">0</b>
      <span>Confirmed</span>
    </div>
    <div class="stat-box stat-amber">
      <b id="cntPending">0</b>
      <span>Pending / Active</span>
    </div>
  </div>

  <div id="statusAlert"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Student / Sender</th>
          <th>Teacher / Receiver</th>
          <th>Subject</th>
          <th>Status</th>
          <th>Table Source</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" style="text-align:center;padding:16px;color:#64748b;">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = "https://agxoxrtetmcfwbpzyypo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneG94cnRldG1jZndicHp5eXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjg2MDIsImV4cCI6MjEwMjcwNDYwMn0.ASD3Sv83YCdwQURKYsuORWgBnSj37vXlz7EIEMFC3u0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PIN = "1985";

function submitPin() {
  const entered = document.getElementById("pinInput").value.trim();
  if (entered === PIN) {
    sessionStorage.setItem("apex_admin_auth", "true");
    document.getElementById("gateOverlay").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadData();
  } else {
    document.getElementById("gateErr").style.display = "block";
    document.getElementById("pinInput").value = "";
  }
}

function logoutAdmin() {
  sessionStorage.removeItem("apex_admin_auth");
  window.location.reload();
}

async function loadData() {
  const alertEl = document.getElementById("statusAlert");
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:16px;">Loading database records...</td></tr>`;

  let rows = [];
  let errors = [];

  // Query 1: enquiries
  const { data: d1, error: e1 } = await db.from("enquiries").select("*").order("created_at", { ascending: false });
  if (e1) errors.push(`enquiries error: ${e1.message}`);
  else if (d1) {
    d1.forEach(r => rows.push({
      date: r.created_at,
      sender: r.sender_name || r.sender_mobile || "Student",
      receiver: r.recipient_name || r.recipient_mobile || "Teacher",
      subject: r.subject || "Tuition",
      status: r.status || "Pending",
      table: "enquiries"
    }));
  }

  // Query 2: tuition_inquiries
  const { data: d2, error: e2 } = await db.from("tuition_inquiries").select("*").order("created_at", { ascending: false });
  if (e2) errors.push(`tuition_inquiries error: ${e2.message}`);
  else if (d2) {
    d2.forEach(r => rows.push({
      date: r.created_at,
      sender: r.student_name || "Student",
      receiver: r.teacher_name || "Teacher",
      subject: r.subject || "Tuition",
      status: r.status === "confirmed" ? "Confirmed" : "In Discussion",
      table: "tuition_inquiries"
    }));
  }

  // Alert message for status or permission issues
  if (errors.length > 0) {
    alertEl.style.display = "block";
    alertEl.style.background = "#fee2e2";
    alertEl.style.color = "#991b1b";
    alertEl.textContent = "RLS Issue: " + errors.join(" | ") + " (Run Step 1 SQL in Supabase dashboard to enable reading)";
  } else {
    alertEl.style.display = "none";
  }

  // Update counts
  const confirmed = rows.filter(r => String(r.status).toLowerCase() === "confirmed").length;
  const pending = rows.filter(r => {
    const s = String(r.status).toLowerCase();
    return s === "pending" || s === "contacted" || s === "in discussion";
  }).length;

  document.getElementById("cntTotal").textContent = rows.length;
  document.getElementById("cntConfirmed").textContent = confirmed;
  document.getElementById("cntPending").textContent = pending;

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:16px;color:#64748b;">No records found. Run the SQL script from Step 1 in your Supabase SQL Editor if data exists.</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const dStr = r.date ? new Date(r.date).toLocaleDateString("en-GB") : "-";
    const st = String(r.status).toLowerCase();
    let badgeClass = "badge-pending";
    if (st === "confirmed") badgeClass = "badge-confirmed";
    else if (st === "cancelled" || st === "rejected") badgeClass = "badge-other";

    return `
      <tr>
        <td style="color:#64748b;">${dStr}</td>
        <td><b>${escapeHtml(r.sender)}</b></td>
        <td><b>${escapeHtml(r.receiver)}</b></td>
        <td>${escapeHtml(r.subject)}</td>
        <td><span class="badge ${badgeClass}">${escapeHtml(r.status)}</span></td>
        <td><code style="font-size:11px;background:#f1f5f9;padding:2px 4px;border-radius:4px;">${r.table}</code></td>
      </tr>
    `;
  }).join("");
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" })[m]);
}

window.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem("apex_admin_auth") === "true") {
    document.getElementById("gateOverlay").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadData();
  }
});
</script>
</body>
</html>
