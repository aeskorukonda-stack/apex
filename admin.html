<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Control & Tuition Tracker - Apex Online Tuitions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: linear-gradient(135deg, #f4f7fb 0%, #e9edf5 50%, #f1f5f9 100%);
    color: #1e293b;
    line-height: 1.5;
    min-height: 100vh;
    padding: 20px 12px;
  }

  .fullwidth-page-wrap {
    max-width: 1380px;
    margin: 0 auto;
    width: 100%;
  }

  .box-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(14, 47, 82, 0.05);
    border: 1px solid rgba(226, 232, 240, 0.9);
  }

  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .admin-header h2 {
    margin: 0;
    color: #123c69;
    font-size: 19px;
    font-weight: 800;
  }

  .admin-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    border: 0;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .btn-alt {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
  }

  .btn-secondary {
    background: #64748b;
    color: #ffffff;
  }

  .btn:hover {
    transform: translateY(-1px);
    filter: brightness(0.95);
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .metric-card {
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  .metric-blue { background: #eff6ff; border: 1px solid #bfdbfe; }
  .metric-green { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .metric-amber { background: #fffbeb; border: 1px solid #fde68a; }

  .metric-label { font-size: 11px; font-weight: 700; }
  .metric-blue .metric-label { color: #1e40af; }
  .metric-green .metric-label { color: #065f46; }
  .metric-amber .metric-label { color: #92400e; }

  .metric-val { font-size: 22px; font-weight: 900; margin-top: 2px; }
  .metric-blue .metric-val { color: #1e3a8a; }
  .metric-green .metric-val { color: #047857; }
  .metric-amber .metric-val { color: #b45309; }

  .table-scroll {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    text-align: left;
    min-width: 680px;
  }

  thead tr {
    background: #0e2f52;
    color: #ffffff;
  }

  th, td {
    padding: 10px 12px;
  }

  th:first-child { border-radius: 6px 0 0 0; }
  th:last-child { border-radius: 0 6px 0 0; }

  tbody tr { border-bottom: 1px solid #e2e8f0; }

  .hidden { display: none !important; }

  /* IN-PAGE PIN OVERLAY */
  #pinGateOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(14, 47, 82, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 16px;
  }

  .pin-box {
    background: #ffffff;
    border-radius: 14px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .pin-box input {
    width: 100%;
    height: 42px;
    font-size: 18px;
    letter-spacing: 4px;
    text-align: center;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    margin: 14px 0;
    font-family: inherit;
  }
  .pin-box input:focus {
    outline: none;
    border-color: #2563eb;
  }
</style>
</head>
<body>

<!-- PIN GATE MODAL -->
<div id="pinGateOverlay">
  <div class="pin-box">
    <div style="font-size:32px;color:#0e2f52;margin-bottom:8px;"><i class="fa-solid fa-shield-halved"></i></div>
    <h3 style="font-size:17px;color:#0e2f52;font-weight:800;margin-bottom:4px;">Management Security</h3>
    <p style="font-size:12px;color:#64748b;">Enter secret PIN to unlock the tracker:</p>
    <input type="password" id="gatePinInput" placeholder="••••" autofocus onkeydown="if(event.key==='Enter') verifyAdminPin()">
    <button class="btn btn-alt" style="width:100%;height:40px;font-size:13px;" onclick="verifyAdminPin()">Unlock Console</button>
    <div id="pinErrorMsg" style="color:#ef4444;font-size:11.5px;font-weight:700;margin-top:8px;" class="hidden">❌ Invalid PIN</div>
  </div>
</div>

<div id="fullWidthAdminView" class="fullwidth-page-wrap hidden">
  <div class="box-card">
    <div class="admin-header">
      <h2>🔒 Admin Control & Tuition Tracker</h2>
      <div class="admin-actions">
        <button class="btn btn-alt" onclick="loadAdminTuitionInquiries()">🔄 Refresh Data</button>
        <button class="btn btn-secondary" onclick="exitAdminView()">Exit Admin</button>
      </div>
    </div>

    <!-- ADMIN SUMMARY METRICS -->
    <div class="metrics-grid">
      <div class="metric-card metric-blue">
        <div class="metric-label">TOTAL CONNECTIONS</div>
        <div id="statTotalInquiries" class="metric-val">0</div>
      </div>
      <div class="metric-card metric-green">
        <div class="metric-label">🟢 CONFIRMED TUITIONS</div>
        <div id="statConfirmedTuitions" class="metric-val">0</div>
      </div>
      <div class="metric-card metric-amber">
        <div class="metric-label">🟡 IN DISCUSSION / PENDING</div>
        <div id="statDiscussingTuitions" class="metric-val">0</div>
      </div>
    </div>

    <!-- LIVE DATA TABLE -->
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Date Contacted</th>
            <th>Teacher</th>
            <th>Student</th>
            <th>Subject</th>
            <th>Teacher Decision</th>
            <th>Student Decision</th>
            <th>Tuition Status</th>
          </tr>
        </thead>
        <tbody id="adminInquiriesTableBody">
          <tr>
            <td colspan="7" style="padding:16px;text-align:center;color:#64748b;">Loading tuition data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://agxoxrtetmcfwbpzyypo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneG94cnRldG1jZndicHp5eXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjg2MDIsImV4cCI6MjEwMjcwNDYwMn0.ASD3Sv83YCdwQURKYsuORWgBnSj37vXlz7EIEMFC3u0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_SECRET_KEY = "1985";

function escapeHtml(val) {
  return String(val || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" })[m]);
}

function verifyAdminPin() {
  const pin = document.getElementById("gatePinInput").value.trim();
  if (pin === ADMIN_SECRET_KEY) {
    sessionStorage.setItem("apex_admin_authed", "true");
    document.getElementById("pinGateOverlay").classList.add("hidden");
    document.getElementById("fullWidthAdminView").classList.remove("hidden");
    loadAdminTuitionInquiries();
  } else {
    document.getElementById("pinErrorMsg").classList.remove("hidden");
    document.getElementById("gatePinInput").value = "";
    document.getElementById("gatePinInput").focus();
  }
}

function exitAdminView() {
  sessionStorage.removeItem("apex_admin_authed");
  window.location.replace("index.html");
}

// QUERY BOTH TABLES (tuition_inquiries + enquiries)
async function loadAdminTuitionInquiries() {
  const tbody = document.getElementById("adminInquiriesTableBody");
  tbody.innerHTML = `<tr><td colspan="7" style="padding:14px;text-align:center;color:#64748b;"><i class="fa-solid fa-spinner fa-spin"></i> Loading tuition data...</td></tr>`;

  try {
    // 1. Try querying tuition_inquiries
    let allRecords = [];
    const { data: tiData, error: tiErr } = await db.from("tuition_inquiries").select("*").order("created_at", { ascending: false });
    if (!tiErr && tiData) {
      allRecords = allRecords.concat(tiData);
    }

    // 2. Also query enquiries table to capture records created via WhatsApp connect
    const { data: enqData, error: enqErr } = await db.from("enquiries").select("*").order("created_at", { ascending: false });
    if (!enqErr && enqData) {
      enqData.forEach(e => {
        // Map enquiries schema to table display format
        allRecords.push({
          created_at: e.created_at,
          teacher_name: e.recipient_name || e.recipient_mobile || "Teacher",
          student_name: e.sender_name || e.sender_mobile || "Student",
          subject: e.subject || "Tuition",
          teacher_status: e.status ? e.status.toLowerCase() : "contacted",
          student_status: e.status ? e.status.toLowerCase() : "contacted",
          teacher_confirmed: String(e.status).toLowerCase() === "confirmed",
          student_confirmed: String(e.status).toLowerCase() === "confirmed",
          status: e.status ? e.status.toLowerCase() : "contacted"
        });
      });
    }

    if (allRecords.length === 0) {
      // Diagnostic check: report if RLS prevented access
      if (tiErr && enqErr) {
        tbody.innerHTML = `<tr><td colspan="7" style="padding:14px;text-align:center;color:#ef4444;">Database Permission Error: ${tiErr.message || enqErr.message}</td></tr>`;
        return;
      }
      tbody.innerHTML = `<tr><td colspan="7" style="padding:14px;text-align:center;color:#64748b;">No connections recorded yet.</td></tr>`;
      document.getElementById("statTotalInquiries").textContent = "0";
      document.getElementById("statConfirmedTuitions").textContent = "0";
      document.getElementById("statDiscussingTuitions").textContent = "0";
      return;
    }

    const confirmed = allRecords.filter(d => String(d.status).toLowerCase() === 'confirmed').length;
    const discussing = allRecords.filter(d => {
      const st = String(d.status).toLowerCase();
      return st === 'discussing' || st === 'contacted' || st === 'pending';
    }).length;

    document.getElementById("statTotalInquiries").textContent = allRecords.length;
    document.getElementById("statConfirmedTuitions").textContent = confirmed;
    document.getElementById("statDiscussingTuitions").textContent = discussing;

    tbody.innerHTML = allRecords.map((d, index) => {
      const isEven = (index % 2 === 0);
      const dateStr = d.created_at ? new Date(d.created_at).toLocaleDateString('en-GB') : 'Recent';
      
      const st = String(d.status || '').toLowerCase();
      let badgeColor = '#0284c7';
      let statusLabel = 'CONTACTED';

      if (st === 'confirmed') { 
        badgeColor = '#059669'; 
        statusLabel = '✅ CONFIRMED TUITION'; 
      } else if (st === 'discussing' || st === 'pending') { 
        badgeColor = '#d97706'; 
        statusLabel = '⏳ IN DISCUSSION / PENDING'; 
      } else if (st === 'cancelled' || st === 'rejected' || st === 'not_started') { 
        badgeColor = '#dc2626'; 
        statusLabel = '❌ CANCELLED / REJECTED'; 
      }

      return `
        <tr style="border-bottom:1px solid #e2e8f0;background:${isEven ? '#ffffff' : '#f8fafc'};">
          <td style="padding:8px 10px;color:#64748b;">${dateStr}</td>
          <td style="padding:8px 10px;font-weight:700;color:#123c69;">${escapeHtml(d.teacher_name)}</td>
          <td style="padding:8px 10px;font-weight:700;color:#0f172a;">${escapeHtml(d.student_name)}</td>
          <td style="padding:8px 10px;color:#334155;">${escapeHtml(d.subject)}</td>
          <td style="padding:8px 10px;">${d.teacher_confirmed ? '✅ Confirmed' : escapeHtml(d.teacher_status || 'contacted')}</td>
          <td style="padding:8px 10px;">${d.student_confirmed ? '✅ Confirmed' : escapeHtml(d.student_status || 'contacted')}</td>
          <td style="padding:8px 10px;">
            <span style="background:${badgeColor}15;color:${badgeColor};padding:3px 8px;border-radius:4px;font-weight:800;font-size:10.5px;border:1px solid ${badgeColor}40;">
              ${statusLabel}
            </span>
          </td>
        </tr>
      `;
    }).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="padding:14px;text-align:center;color:#ef4444;">Error loading table: ${err.message}</td></tr>`;
  }
}

window.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem("apex_admin_authed") === "true") {
    document.getElementById("pinGateOverlay").classList.add("hidden");
    document.getElementById("fullWidthAdminView").classList.remove("hidden");
    loadAdminTuitionInquiries();
  }
});
</script>
</body>
</html>
