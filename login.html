<!DOCTYPE html>
<html>
  <head>
    <title>Login - Apex Tuition</title>
    <!-- 1. Google's Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- 2. Supabase's Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <h1>Sign In to Apex Tuition</h1>

    <script>
      // Initialize Supabase
      const supabaseUrl = 'https://YOUR_PROJECT_REF.supabase.co';
      const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      // Function that runs when Google finishes
      async function handleGoogleResponse(response) {
        console.log('Received token from Google!');

        const { data, error } = await supabase.auth.signInWithIdToken({
          provider: 'google',
          token: response.credential,
        });

        if (error) {
          alert('Error logging in: ' + error.message);
        } else {
          alert('Logged in successfully as ' + data.user.email);
          // Redirect them to your site:
          // window.location.href = '/dashboard';
        }
      }

      // Tell Google to start up when the page finishes loading
      window.onload = function () {
        window.google.accounts.id.initialize({
          client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com',
          callback: handleGoogleResponse,
        });

        // Trigger the One Tap prompt
        window.google.accounts.id.prompt();
      };
    </script>
  </body>
</html>
