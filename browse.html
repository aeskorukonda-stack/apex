  <style>
    :root {
      --apex-navy: #0A192F;
      --apex-navy-surface: #112240;
      --apex-navy-dark: #070F1E;
      --royal-blue: #2563EB;
      --royal-blue-hover: #1D4ED8;
      --royal-blue-glow: rgba(37, 99, 235, 0.18);
      --apex-gold: #F59E0B;
      --apex-gold-hover: #D97706;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-light: #ECFDF5;
      --bg-slate: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --card-radius: 14px;
      --btn-radius: 10px;
      --shadow-card: 0 2px 10px -2px rgba(10, 25, 47, 0.05);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; max-width: 100%; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden !important; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(10, 25, 47, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-bottom: 3px solid var(--apex-gold);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
    }
    .header-wrap {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-text h1 { font-size: 18px; color: #ffffff; font-weight: 800; letter-spacing: -0.3px; line-height: 1; margin: 0; }

    .nav-links-desktop { display: flex; align-items: center; gap: 8px; }
    .nav-link {
      color: #CBD5E1; text-decoration: none; font-weight: 600; font-size: 13.5px; padding: 8px 16px; border-radius: 8px;
      transition: var(--transition); display: inline-flex; align-items: center; gap: 7px;
    }
    .nav-link:hover, .nav-link.active { color: #ffffff; background: rgba(255, 255, 255, 0.12); }

    .dropdown-parent { position: relative; padding-bottom: 8px; margin-bottom: -8px; }
    .dropdown-menu {
      position: absolute; top: 100%; right: 0; background: #ffffff; border-radius: 12px;
      border: 1px solid var(--border-subtle); box-shadow: 0 16px 36px rgba(10, 25, 47, 0.16);

    .dropdown-item {

      font-size: 13px; font-weight: 700; text-decoration: none !important; border-radius: 8px; transition: var(--transition);

    .dropdown-item:hover { background: #EFF6FF; color: var(--royal-blue) !important; }

    .btn-header-cta {

    .mobile-menu-toggle { display: none; background: none; border: none; color: #ffffff; font-size: 20px; cursor: pointer; }
    .mobile-drawer {

function clean(v) { return String(v || '').trim(); }
function cleanDigits(v) { return String(v || '').replace(/\D/g, ''); }
function toggleMobileNav() { document.getElementById("mobileDrawer").classList.toggle("open"); }
function toggleAdvancedFilters() { document.getElementById("advancedDrawer").classList.toggle("open"); }

function formatGradeRanges(rawClasses) {
  if (!rawClasses) return 'All Grades';
  if (!rawClasses.includes('Class')) return rawClasses;
  const nums = [], others = [];
  rawClasses.split(',').forEach(p => {
    p = p.trim();
    const match = p.match(/Class\s*(\d+)/i) || p.match(/Grade\s*(\d+)/i);
    if (match) nums.push(parseInt(match[1], 10));
    else others.push(p);
  });
  if (nums.length === 0) return rawClasses;
  nums.sort((a, b) => a - b);
  const ranges = [];
  let start = nums[0], end = nums[0];
  for (let i = 1; i < nums.length; i++) {
    if (nums[i] === end + 1) end = nums[i];
    else {
      ranges.push(start === end ? `Grade ${start}` : `Grades ${start} to ${end}`);
      start = end = nums[i];
    }
  }
  ranges.push(start === end ? `Grade ${start}` : `Grades ${start} to ${end}`);
  if (others.length > 0) return `${ranges.join(', ')} • ${others.join(', ')}`;
  return ranges.join(', ');
}

function parseSpecMetrics(qualificationRaw, timingFeeRaw) {
  let qual = "Educator", exp = "", price = "Negotiable";
  if (qualificationRaw) {
    if (qualificationRaw.includes("•")) { const qp = qualificationRaw.split("•"); qual = qp[0].trim(); exp = qp[1].trim(); }
    else qual = qualificationRaw.trim();
  }
  if (timingFeeRaw) {
    if (timingFeeRaw.includes("•")) { const tp = timingFeeRaw.split("•"); price = tp[0].trim(); }
    else price = timingFeeRaw.trim();
  }
  return { qual, exp, price };
}

function cleanSubjectText(sub) {
  if (!sub) return 'All Subjects';
  return sub.replace(/^(Academic:\s*|Non-Academic:\s*|Competitive:\s*|Others:\s*)/i, '').trim();
}

const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

async function syncGlobalConfirmedTuitions() {
  lockedStudentIds.clear();
  loggedInStudentHasConfirmedTuition = false;
  myConfirmedTeacherId = null;
  teacherSuccessfulTuitionMap = {};

  const currentUid = currentUser ? clean(currentUser.id) : "";
  const currentMob = currentProfile ? cleanDigits(currentProfile.mobile) : "";

  const { data: enqData } = await db.from("enquiries").select("*");
  if (enqData) {
    enqData.forEach(row => {
      const sId = clean(row.sender_id);
      const rId = clean(row.recipient_id);
      const sMob = cleanDigits(row.sender_mobile);
      const rMob = cleanDigits(row.recipient_mobile);
      const status = String(row.status || '').toLowerCase();

      if (status === 'confirmed') {
        if (sId) lockedStudentIds.add(sId);
        if (rId) lockedStudentIds.add(rId);
        if (sMob) lockedStudentIds.add(sMob);
        if (rMob) lockedStudentIds.add(rMob);

        if (currentRole === 'student') {
          if (sId === currentUid || rId === currentUid || (currentMob && (sMob === currentMob || rMob === currentMob))) {
            loggedInStudentHasConfirmedTuition = true;
            myConfirmedTeacherId = (sId === currentUid) ? rId : sId;
          }
        }
      }

      if (status === 'completed') {
        const start = new Date(row.confirmed_at || row.created_at).getTime();
        const end = new Date(row.ended_at || Date.now()).getTime();
        if ((end - start) >= THIRTY_DAYS_MS) {
          const tId = rId || sId;
          if (tId) teacherSuccessfulTuitionMap[tId] = (teacherSuccessfulTuitionMap[tId] || 0) + 1;
        }
      }
    });
  }
}

function renderStarBadge(teacherId) {
  const count = teacherSuccessfulTuitionMap[teacherId] || 0;
  const stars = Math.min(5, Math.floor(count / 2));
  if (stars === 0) return "";
  return `<div class="star-badge-row"><span>${"⭐".repeat(stars)} (${count})</span></div>`;
}

async function handleWhatsAppConnect(targetId, targetName, targetMobile, subject) {
  if (!currentUser) {
    alert("Please sign in to connect directly on WhatsApp.");
    window.location.href = "index.html?auth=login";
    return;
  }

  const cleanTargetId = clean(targetId);
  if (currentRole === 'student' && loggedInStudentHasConfirmedTuition) {
    if (myConfirmedTeacherId === cleanTargetId) {
      const cleanPhone = cleanDigits(targetMobile);
      window.open(`https://wa.me/${cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone}`, '_blank');
      return;
    }
    alert("You already have an active confirmed tuition. Please end your current confirmed tuition in Enquiries first.");
    return;
  }

  const isTeacher = (currentRole === 'teacher');
  const myName = currentProfile ? (isTeacher ? currentProfile.teacher_name : currentProfile.student_name) : (currentUser.email.split('@')[0]);

  try {
    await db.from("enquiries").insert([{
      sender_id: currentUser.id,
      recipient_id: cleanTargetId,
      sender_name: myName,
      sender_mobile: currentProfile?.mobile || '',
      recipient_name: targetName,
      recipient_mobile: targetMobile,
      subject: subject || 'Tuition',
      status: 'Pending'
    }]);
  } catch (err) {
    console.error("Enquiry log error:", err);
  }

  const cleanPhone = cleanDigits(targetMobile);
  const waPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
  const msg = encodeURIComponent(`Hi ${targetName}, I found your profile on Apex Tuitions for ${subject}. I would like to connect!`);
  window.open(`https://wa.me/${waPhone}?text=${msg}`, '_blank');

  await syncGlobalConfirmedTuitions();
  renderCards(rawData);
}

async function fetchDirectoryData() {
  const grid = document.getElementById("cardsGrid");
  
  let targetTable = 'teachers';
  if (currentRole === 'teacher') {
    targetTable = 'students';
    document.getElementById("roleNotice").textContent = "Viewing Student Inquiries";
  } else {
    document.getElementById("roleNotice").textContent = "Viewing Verified Tutors";
  }

  // Parallel fetching for high performance
  const [profilesRes] = await Promise.all([
    db.from(targetTable).select('*').order('created_at', { ascending: false }),
    syncGlobalConfirmedTuitions()
  ]);

  const { data, error } = profilesRes;

  if (error || !data || data.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-folder-open"></i>
        <h3>No Profiles Found</h3>
        <p style="font-size:12px;color:var(--text-muted);">Please check back soon.</p>
      </div>
    `;
    document.getElementById("resultsCount").textContent = "0 Profiles Found";
    rawData = [];
    return;
  }

  rawData = data;
  filterDirectory();
}

function renderCards(list) {
  const grid = document.getElementById("cardsGrid");
  document.getElementById("resultsCount").textContent = `Showing ${list.length} profile${list.length === 1 ? '' : 's'}`;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h3>No Matching Results</h3>
        <p style="font-size:12px;color:var(--text-muted);">Try adjusting your search criteria.</p>
      </div>
    `;
    return;
  }

  const isTeacherTable = (currentRole !== 'teacher');

  grid.innerHTML = list.map(item => {
    const itemId = clean(item.id);
    const itemMobDigits = cleanDigits(item.mobile);
    const name = isTeacherTable ? (item.teacher_name || 'Verified Educator') : (item.student_name || 'Student Member');
    const roleBadge = isTeacherTable ? 'Educator 👨‍🏫' : 'Student 🎓';
    const avatar = item.avatar_url || (isTeacherTable ? 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' : 'https://cdn-icons-png.flaticon.com/512/3135/3135768.png');
    
    const subject = cleanSubjectText(item.subject);
    const groupedGrades = formatGradeRanges(isTeacherTable ? item.classes : item.student_class);
    const board = item.board || 'CBSE';
    const mode = item.tuition_mode || 'Online';
    const { qual, exp, price } = parseSpecMetrics(item.qualification, item.timing_fee_desc);

    let actionBtnHtml = "";
    if (!isTeacherTable && (lockedStudentIds.has(itemId) || (itemMobDigits && lockedStudentIds.has(itemMobDigits)))) {
      actionBtnHtml = `<span class="btn-locked-tuition">✓ Confirmed</span>`;
    } else {
      actionBtnHtml = `
        <button class="btn-connect-wa" onclick="handleWhatsAppConnect('${itemId}', '${name}', '${item.mobile || ''}', '${subject}')">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </button>
      `;
    }

    return `
      <div class="tutor-card">
        <div>
          <div class="card-top">
            <div class="card-identity">
              <img src="${avatar}" alt="${name}" class="card-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png';">
              <div class="card-title-group">
                <h3>${name}</h3>
                ${isTeacherTable ? renderStarBadge(itemId) : ''}
                <span class="pill-tag pill-role">${roleBadge}</span>
              </div>
            </div>
            ${(isTeacherTable && price) ? `<div class="card-price-badge">${price}</div>` : ''}
          </div>

          <div class="spec-pills-row">
            <span class="pill-tag pill-mode"><i class="fa-solid fa-video"></i> ${mode}</span>
            <span class="pill-tag pill-qual"><i class="fa-solid fa-graduation-cap"></i> ${groupedGrades}</span>
            ${(isTeacherTable && qual && qual !== 'Educator') ? `<span class="pill-tag pill-qual"><i class="fa-solid fa-certificate"></i> ${qual}</span>` : ''}
            ${(isTeacherTable && exp) ? `<span class="pill-tag pill-exp"><i class="fa-solid fa-briefcase"></i> ${exp}</span>` : ''}
          </div>

          <div class="card-meta-compact">
            <div class="meta-row" title="${subject}">
              <i class="fa-solid fa-book-open"></i>
              <span class="truncate-text"><b>Subject:</b> ${subject}</span>
            </div>
            <div class="meta-row" title="${board}">
              <i class="fa-solid fa-chalkboard"></i>
              <span class="truncate-text"><b>Board:</b> ${board}</span>
            </div>
          </div>
        </div>

        <div class="card-footer">
          ${actionBtnHtml}
        </div>
      </div>
    `;
  }).join('');
}

function filterDirectory() {
  const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
  const cat = document.getElementById("filterCategory").value;
  const level = document.getElementById("filterLevel").value;
  const board = document.getElementById("filterBoard").value;
  const subject = document.getElementById("filterSubject").value;
  const mode = document.getElementById("filterMode").value;

  const filtered = rawData.filter(item => {
    const name = (item.teacher_name || item.student_name || '').toLowerCase();
    const rawCat = (item.classes || '') + ' ' + (item.subject || '') + ' ' + (item.student_class || '');
    const rawLevel = (item.classes || '') + ' ' + (item.student_class || '');
    const rawBoard = item.board || '';
    const rawSubject = item.subject || '';
    const rawMode = item.tuition_mode || '';
    const rawLocation = (item.address || '').toLowerCase();

    const matchesSearch = !searchQuery || 
      name.includes(searchQuery) || 
      rawSubject.toLowerCase().includes(searchQuery) || 
      rawBoard.toLowerCase().includes(searchQuery) || 
      rawLocation.includes(searchQuery);

    if (!matchesSearch) return false;

    let matchCat = (cat === "All");
    if (!matchCat) {
      if (cat === "Academic") matchCat = rawCat.includes("Class") || rawCat.includes("Grade");
      else if (cat === "Non-Academic") matchCat = rawCat.includes("Non-Academic") || rawCat.includes("Skill");
      else if (cat === "Competitive") matchCat = rawCat.includes("Competitive");
      else matchCat = rawCat.includes("Others");
    }

    let matchLevel = (level === "All");
    if (!matchLevel) {
      matchLevel = rawLevel.includes(level);
    }

    const matchBoard = (board === "All") || rawBoard.toLowerCase().includes(board.toLowerCase());
    const matchSubject = (subject === "All") || rawSubject.toLowerCase().includes(subject.toLowerCase());
    const matchMode = (mode === "All") || rawMode.toLowerCase().includes(mode.toLowerCase()) || (rawMode === "Both");

    return matchCat && matchLevel && matchBoard && matchSubject && matchMode;
  });

  renderCards(filtered);
}

window.addEventListener("load", async () => {
  const { data: { session } } = await db.auth.getSession();
  const navLogin = document.getElementById("navBtnLogin");
  const mNavLogin = document.getElementById("mNavLogin");

  if (session && session.user) {
    currentUser = session.user;
    navLogin?.classList.add("hidden");
    mNavLogin?.classList.add("hidden");

    const { data: t } = await db.from("teachers").select("*").eq("id", currentUser.id).maybeSingle();
    if (t) {
      currentRole = 'teacher';
      currentProfile = t;
    } else {
      const { data: s } = await db.from("students").select("*").eq("id", currentUser.id).maybeSingle();
      currentRole = 'student';
      currentProfile = s;
    }

    const dockBrowseLabel = document.getElementById("dockBrowseLabel");
    if (dockBrowseLabel) dockBrowseLabel.textContent = (currentRole === 'teacher') ? "Students" : "Teachers";

    const { data: enqPending } = await db.from("enquiries").select("id").eq("recipient_id", currentUser.id).eq("status", "Pending");
    const dBadge = document.getElementById("dockEnquiryBadge");
    if (dBadge && enqPending && enqPending.length > 0) {
      dBadge.textContent = enqPending.length;
      dBadge.classList.remove("hidden");
    }
  } else {
    navLogin?.classList.remove("hidden");
    mNavLogin?.classList.remove("hidden");
  }

  await fetchDirectoryData();
});
</script>
