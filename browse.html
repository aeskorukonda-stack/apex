<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --apex-navy: #0A192F;
      --apex-navy-surface: #112240;
      --royal-blue: #2563EB;
      --royal-blue-hover: #1D4ED8;
      --apex-gold: #F59E0B;
      --emerald: #10B981;
      --bg-slate: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --card-radius: 16px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 74px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--apex-navy);
      padding: 12px 24px;
      border-bottom: 3.5px solid var(--apex-gold);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
      width: 100%;
    }
    .header-wrap {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #FFFFFF;
      object-fit: cover;
    }
    .brand-text h1 {
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-links-desktop {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link {
      color: #CBD5E1;
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      padding: 7px 14px;
      border-radius: 8px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link:hover, .nav-link.active { color: #FFFFFF; background: rgba(255, 255, 255, 0.1); }

    .dropdown-parent { 
      position: relative; 
      padding-bottom: 8px;
      margin-bottom: -8px;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(10, 25, 47, 0.16);

      padding: 8px;

      z-index: 2000;
    }
    .dropdown-parent:hover .dropdown-menu { display: block; }
    .dropdown-item {
      display: flex;
      align-items: center;

      padding: 10px 14px;

      font-size: 13px;
      font-weight: 700;
      text-decoration: none !important;

      transition: var(--transition);
    }
    .dropdown-item:hover {

      color: var(--royal-blue) !important;
      transform: translateX(3px);
    }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
    }
    .mobile-drawer {
      display: none;
      position: fixed;
      top: 74px;
      left: 0;
      right: 0;
      background: var(--apex-navy);
      padding: 20px 24px;
      border-bottom: 3.5px solid var(--apex-gold);
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .mobile-drawer.open { display: flex; }
    .mobile-drawer a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: block;
    }

    main {
      flex: 1;
      padding: 24px 20px 80px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* TOP SEARCH CONTROLS */

      border-radius: var(--card-radius);
      padding: 20px;
      box-shadow: 0 4px 14px rgba(10, 25, 47, 0.04);

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;

      margin-top: 14px;

    .filter-grid input, .filter-grid select {

      border: 1.5px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }

    /* LISTINGS GRID */
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .profile-item-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 22px;
      box-shadow: 0 6px 20px rgba(10, 25, 47, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
    }
    .profile-item-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(10, 25, 47, 0.1);
      border-color: #BFDBFE;
    }
    .card-top {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-avatar {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--apex-navy);
      flex-shrink: 0;
    }
    .card-title-wrap h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--apex-navy);
      margin-bottom: 2px;
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;

    .card-badge-teacher { background: #DCFCE7; color: #15803D; }
    .card-badge-student { background: #FEF3C7; color: #B45309; }

    .card-details-box {
      font-size: 12.5px;

      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #334155;
    }
    .detail-row i {
      color: var(--royal-blue);
      margin-top: 3px;
      width: 14px;
      text-align: center;
    }

    .btn-connect-action {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-connect-wa { background: #10B981; color: #FFFFFF; }
    .btn-connect-wa:hover { background: #059669; }
    .btn-connect-locked {
      background: #10B981;
      color: #FFFFFF;
      cursor: default;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .btn-connect-disabled {
      background: #E2E8F0;
      color: #64748B;
      cursor: not-allowed;
    }
    .btn-connect-pending {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
      cursor: pointer;
    }

    .mobile-bottom-dock { display: none !important; }

    @media (max-width: 768px) {
      body.logged-in-mobile { padding-bottom: 84px !important; }
      .filter-grid { grid-template-columns: 1fr; }
      .profiles-grid { grid-template-columns: 1fr; }

      body.logged-in-mobile .mobile-bottom-dock {
        display: grid !important;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        position: fixed;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(16px);
        padding: 8px 12px max(8px, env(safe-area-inset-bottom)) 12px !important;
        border-top: 1.5px solid var(--border-subtle) !important;
        box-shadow: 0 -4px 20px rgba(10, 25, 47, 0.08) !important;
        z-index: 1000 !important;
      }
      .mobile-bottom-dock .dock-btn {
        background: #FFFFFF;
        border: 1.5px solid var(--border-subtle);
        color: var(--apex-navy);
        padding: 6px 4px 6px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 800;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 4px;

      }
      .mobile-bottom-dock .dock-btn .tile-icon-bubble {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;

      }
      .mobile-bottom-dock .dock-btn.tile-enquiries .tile-icon-bubble { background: #ECFDF5; color: #10B981; }
      .mobile-bottom-dock .dock-btn.tile-profile .tile-icon-bubble { background: #FEF3C7; color: #D97706; }
      .mobile-bottom-dock .dock-btn.tile-browse .tile-icon-bubble { background: #EFF6FF; color: #2563EB; }
      .mobile-bottom-dock .dock-btn:hover, .mobile-bottom-dock .dock-btn.active { border-color: var(--royal-blue); }
      .mobile-bottom-dock .dock-badge {
        position: absolute;
        top: -4px;
        right: -3px;
        background: #EF4444;
        color: #FFFFFF;
        font-size: 9.5px;
        font-weight: 800;
        border-radius: 12px;
        padding: 1px 6px;
      }
    }

    .hidden { display: none !important; }
  </style>
</head>

<script>
const SUPABASE_URL = "https://agxoxrtetmcfwbpzyypo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneG94cnRldG1jZndicHp5eXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjg2MDIsImV4cCI6MjEwMjcwNDYwMn0.ASD3Sv83YCdwQURKYsuORWgBnSj37vXlz7EIEMFC3u0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentRole = null;
let currentProfile = null;
let myActiveTuition = null;
let myPendingEnquiries = new Map();
let allLoadedListings = [];

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[m]);
}

function toggleMobileNav() { 
  document.getElementById("mobileDrawer").classList.toggle("open"); 
}

function sanitizeWhatsAppUrl(mobile) {
  let clean = String(mobile || '').replace(/\D/g, '');
  if (clean.startsWith('0')) clean = clean.substring(1);
  if (clean.length === 10) clean = '91' + clean;
  return `https://wa.me/${encodeURIComponent(clean)}`;
}

async function loadUserTuitionState() {
  const { data: { session } } = await db.auth.getSession();
  if (!session?.user) return;
  currentUser = session.user;

  const { data: t } = await db.from("teachers").select("*").eq("id", currentUser.id).maybeSingle();
  if (t) {
    currentRole = 'teacher';
    currentProfile = t;
  } else {
    const { data: s } = await db.from("students").select("*").eq("id", currentUser.id).maybeSingle();
    currentRole = 'student';
    currentProfile = s || {};
  }

  // Find any active confirmed tuition
  const { data: confirmed } = await db.from("enquiries")
    .select("*")
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .eq("status", "Confirmed")
    .maybeSingle();

  myActiveTuition = confirmed || null;

  // Find all pending enquiries
  const { data: pendings } = await db.from("enquiries")
    .select("*")
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .eq("status", "Pending");

  myPendingEnquiries.clear();
  if (pendings) {
    pendings.forEach(e => {
      const otherId = (e.sender_id === currentUser.id) ? e.recipient_id : e.sender_id;
      myPendingEnquiries.set(otherId, e);
    });
  }
}

async function handleProfileConnect(targetId, targetRole, targetName, targetMobile, targetSubject) {
  if (!currentUser) {
    window.location.href = "index.html?auth=signin";
    return;
  }

  // RULE: Student cannot contact new teacher with an active tuition. Must end it first.
  if (currentRole === 'student' && myActiveTuition) {
    const partnerId = (myActiveTuition.sender_id === currentUser.id) ? myActiveTuition.recipient_id : myActiveTuition.sender_id;
    if (partnerId === targetId) {
      window.open(sanitizeWhatsAppUrl(targetMobile), '_blank');
      return;
    }
    alert("You already have an active confirmed tuition. You must end your ongoing tuition before contacting a new teacher.");
    window.location.href = "enquiries.html";
    return;
  }

  // Teacher contacting student with existing confirmed relationship
  if (myActiveTuition && (myActiveTuition.sender_id === targetId || myActiveTuition.recipient_id === targetId)) {
    window.open(sanitizeWhatsAppUrl(targetMobile), '_blank');
    return;
  }

  // Pending enquiry check
  if (myPendingEnquiries.has(targetId)) {
    alert("An enquiry is already pending with " + targetName + ". Please visit your Enquiries tab.");
    window.location.href = "enquiries.html";
    return;
  }

  // Confirm sending enquiry
  if (!confirm(`Send tuition enquiry to ${targetName}? Once accepted, tuition will be confirmed and direct WhatsApp contact will be established.`)) return;

  const senderName = currentProfile?.teacher_name || currentProfile?.student_name || 'Member';
  const senderMobile = currentProfile?.mobile || '';

  const { error } = await db.from("enquiries").insert([{
    sender_id: currentUser.id,
    recipient_id: targetId,
    sender_name: senderName,
    sender_mobile: senderMobile,
    recipient_name: targetName,
    recipient_mobile: targetMobile,
    subject: targetSubject || 'Tuition Requirement',
    status: 'Pending',
    created_at: new Date().toISOString()
  }]);

  if (error) {
    alert("Could not send enquiry: " + error.message);
  } else {
    alert(`Enquiry successfully sent to ${targetName}! Once accepted, tuition will be confirmed.`);
    window.location.href = "enquiries.html";
  }
}

function renderActionButton(item) {
  const isTargetTeacher = (item.role === 'teacher');
  const targetId = item.id;
  const targetName = escapeHtml(item.name);
  const targetMobile = item.mobile || '';
  const targetSubject = escapeHtml(item.subject || 'Tuition');

  if (!currentUser) {
    return `
      <button class="btn-connect-action btn-connect-wa" onclick="window.location.href='index.html?auth=signin'">
        <i class="fa-brands fa-whatsapp"></i> Connect via WhatsApp
      </button>
    `;
  }

  const isConfirmedPartner = myActiveTuition && 
    (myActiveTuition.sender_id === targetId || myActiveTuition.recipient_id === targetId);

  // IF CONFIRMED:
  if (isConfirmedPartner) {
    if (currentRole === 'student') {
      // STUDENT'S WHATSAPP BUTTON IS LOCKED WITH TUITION CONFIRMED
      return `
        <button class="btn-connect-action btn-connect-locked" title="Tuition confirmed with this teacher.">
          <i class="fa-solid fa-lock"></i> Tuition Confirmed
        </button>
      `;
    } else {
      // TEACHER'S WHATSAPP BUTTON REMAINS UNLOCKED
      return `
        <a href="${sanitizeWhatsAppUrl(targetMobile)}" target="_blank" rel="noopener noreferrer" class="btn-connect-action btn-connect-wa">
          <i class="fa-brands fa-whatsapp"></i> Chat WhatsApp
        </a>
      `;
    }
  }

  // IF STUDENT HAS AN ACTIVE TUITION WITH ANOTHER TEACHER -> LOCKED
  if (currentRole === 'student' && myActiveTuition && !isConfirmedPartner) {
    return `
      <button class="btn-connect-action btn-connect-disabled" disabled title="You must end your ongoing tuition to contact a new teacher.">
        <i class="fa-solid fa-ban"></i> Tuition In Progress (Locked)
      </button>
    `;
  }

  // IF ENQUIRY IS PENDING
  if (myPendingEnquiries.has(targetId)) {
    return `
      <button class="btn-connect-action btn-connect-pending" onclick="window.location.href='enquiries.html'">
        <i class="fa-solid fa-clock"></i> Enquiry Pending
      </button>
    `;
  }

  // DEFAULT CONNECT BUTTON
  return `
    <button class="btn-connect-action btn-connect-wa" onclick="handleProfileConnect('${targetId}', '${item.role}', '${targetName}', '${targetMobile}', '${targetSubject}')">
      <i class="fa-brands fa-whatsapp"></i> Connect via WhatsApp
    </button>
  `;
}

function renderCard(item) {
  const isTeacher = (item.role === 'teacher');
  const avatar = item.avatar_url || (isTeacher 
    ? "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
    : "https://cdn-icons-png.flaticon.com/512/3135/3135768.png");

  return `
    <div class="profile-item-card">
      <div>
        <div class="card-top">
          <img src="${avatar}" alt="Avatar" class="card-avatar">
          <div class="card-title-wrap">
            <h3>${escapeHtml(item.name)}</h3>
            <span class="card-badge ${isTeacher ? 'card-badge-teacher' : 'card-badge-student'}">
              ${isTeacher ? 'Verified Educator 👨‍🏫' : 'Student / Learner 🎓'}
            </span>
          </div>
        </div>

        <div class="card-details-box">
          <div class="detail-row">
            <i class="fa-solid fa-book-open"></i>
            <div><strong>Subject:</strong> ${escapeHtml(item.subject || 'All Subjects')}</div>
          </div>
          <div class="detail-row">
            <i class="fa-solid fa-graduation-cap"></i>
            <div><strong>Grades / Board:</strong> ${escapeHtml(item.classes || 'Any')} • ${escapeHtml(item.board || 'Any Board')}</div>
          </div>
          <div class="detail-row">
            <i class="fa-solid fa-chalkboard-user"></i>
            <div><strong>Tuition Mode:</strong> ${escapeHtml(item.tuition_mode || 'Online')}</div>
          </div>
          <div class="detail-row">
            <i class="fa-solid fa-location-dot"></i>
            <div><strong>Location:</strong> ${escapeHtml(item.address || 'Flexible')}</div>
          </div>
          <div class="detail-row">
            <i class="fa-regular fa-clock"></i>
            <div><strong>Schedule &amp; Fee:</strong> ${escapeHtml(item.timing_fee_desc || 'Negotiable')}</div>
          </div>
        </div>
      </div>

      <div>
        ${renderActionButton(item)}
      </div>
    </div>
  `;
}

function applyFilters() {
  const kw = document.getElementById("filterKeyword").value.trim().toLowerCase();
  const mode = document.getElementById("filterMode").value;
  const board = document.getElementById("filterBoard").value;
  const grade = document.getElementById("filterGrade").value;

  const filtered = allLoadedListings.filter(item => {
    if (mode && item.tuition_mode !== 'Both' && item.tuition_mode !== mode) return false;
    if (board && !String(item.board || '').toLowerCase().includes(board.toLowerCase())) return false;
    if (grade && !String(item.classes || '').toLowerCase().includes(grade.toLowerCase())) return false;
    if (kw) {
      const matchBlob = `${item.name} ${item.subject} ${item.qualification} ${item.address} ${item.board} ${item.classes}`.toLowerCase();
      if (!matchBlob.includes(kw)) return false;
    }
    return true;
  });

  const grid = document.getElementById("profilesGrid");
  if (filtered.length === 0) {
    grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);">No profiles matching the selected filters were found.</p>`;
    return;
  }
  grid.innerHTML = filtered.map(renderCard).join("");
}

async function loadDirectory() {
  await loadUserTuitionState();

  // If current role is teacher -> browse students; if student -> browse teachers; guest -> browse teachers
  const targetTable = (currentRole === 'teacher') ? 'students' : 'teachers';
  const targetRole = (currentRole === 'teacher') ? 'student' : 'teacher';

  document.getElementById("browsePageTitle").textContent = (currentRole === 'teacher') 
    ? "Explore Open Student Tuitions" 
    : "Find Verified Home & Online Tutors";

  const { data, error } = await db.from(targetTable).select("*").order("created_at", { ascending: false });

  if (error) {
    document.getElementById("profilesGrid").innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#EF4444; padding:30px;">Error loading directory: ${error.message}</p>`;
    return;
  }

  allLoadedListings = (data || []).map(r => ({
    id: r.id,
    role: targetRole,
    name: r.teacher_name || r.student_name || 'Member',
    mobile: r.mobile || '',
    subject: r.subject || '',
    classes: r.classes || r.student_class || '',
    board: r.board || '',
    tuition_mode: r.tuition_mode || 'Online',
    address: r.address || '',
    qualification: r.qualification || '',
    timing_fee_desc: r.timing_fee_desc || '',
    avatar_url: r.avatar_url || ''
  }));

  // Parse any URL search queries
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("subject")) document.getElementById("filterKeyword").value = urlParams.get("subject");
  if (urlParams.get("class")) document.getElementById("filterGrade").value = urlParams.get("class");
  if (urlParams.get("board")) document.getElementById("filterBoard").value = urlParams.get("board");

  applyFilters();
}

if (localStorage.getItem("apex_cached_auth") === "true") {
  document.body.classList.add("logged-in-mobile");
}

window.addEventListener("DOMContentLoaded", async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session && session.user) {
    currentUser = session.user;
    localStorage.setItem("apex_cached_auth", "true");
    document.body.classList.add("logged-in-mobile");

    const { data: enq } = await db.from("enquiries")
      .select("id")
      .eq("recipient_id", currentUser.id)
      .eq("status", "Pending");

    if (enq && enq.length > 0) {
      const badge = document.getElementById("dockEnquiryBadge");
      badge.textContent = enq.length;
      badge.classList.remove("hidden");
    }
  }

  await loadDirectory();
});
</script>
