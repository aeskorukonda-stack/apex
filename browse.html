<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Tuitions - Find Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    /* Safe bottom inset for mobile navigation */
    .pb-safe {
      padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 12px));
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col antialiased bg-[#f6f9fc]">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-[#0f2137] text-white shadow-md">
    <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Brand Logo & Name -->
      <div class="flex items-center gap-3 cursor-pointer select-none">
        <div class="w-10 h-10 rounded-full border-2 border-white/80 bg-gradient-to-tr from-blue-700 via-sky-600 to-indigo-800 flex items-center justify-center p-1 shadow-sm">
          <div class="text-center leading-none">
            <span class="block text-[8px] tracking-tighter uppercase font-bold text-amber-400">APEX</span>
            <span class="block text-[6px] tracking-tight font-light text-slate-100">TUITIONS</span>
          </div>
        </div>
        <h1 class="text-lg font-bold tracking-wide uppercase text-white font-sans">
          Apex Tuitions
        </h1>
      </div>

      <!-- Hamburger Menu Icon -->
      <button 
        type="button" 
        aria-label="Open navigation menu"
        class="p-2 rounded-lg text-slate-200 hover:text-white hover:bg-white/10 active:bg-white/20 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <!-- Orange Accent Accent Line -->
    <div class="h-1 bg-amber-500 w-full shadow-inner"></div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 py-4 pb-safe flex flex-col gap-4">

    <!-- Search & Filter Card (Permanent Fix for alignment across all screen widths) -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/70 p-3 sm:p-4">
      <div class="flex items-center gap-2.5 sm:gap-3 w-full">
        <!-- Search Input Box -->
        <div class="flex-1 min-w-0 flex items-center gap-2.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 sm:py-3 focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
          <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input 
            type="text" 
            placeholder="Search by name, subject, board..." 
            class="w-full bg-transparent text-sm sm:text-base text-slate-800 placeholder-slate-400 outline-none truncate"
          />
        </div>

        <!-- Filters Button -->
        <button 
          type="button" 
          class="flex-shrink-0 flex items-center justify-center gap-1.5 px-3.5 sm:px-4 py-2.5 sm:py-3 bg-white border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 active:bg-slate-100 text-sm font-semibold shadow-sm transition-all select-none"
        >
          <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
          <span>Filters</span>
        </button>
      </div>
    </section>

    <!-- Profile Status Row -->
    <div class="flex items-center justify-between px-1 text-sm">
      <span class="font-medium text-slate-500">Showing 1 profile</span>
      <span class="font-semibold text-blue-600 hover:underline cursor-pointer flex items-center gap-1">
        Viewing Verified Educators
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </span>
    </div>

    <!-- Profile Card -->
    <article class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5 flex flex-col gap-4 transition hover:shadow-md">
      
      <!-- Top Row: Avatar + Name/Role + Price Pill -->
      <div class="flex items-start justify-between gap-3">
        <!-- Avatar & Name Group -->
        <div class="flex items-center gap-3 min-w-0">
          <!-- Avatar with Verified Badge -->
          <div class="relative flex-shrink-0">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 text-white flex items-center justify-center text-xl font-bold shadow-sm">
              T
            </div>
            <!-- Checkmark badge -->
            <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-white shadow-sm" title="Verified Educator">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </div>

          <!-- Tutor Name & Role -->
          <div class="min-w-0 flex flex-col">
            <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug truncate">
              Test teacher
            </h2>
            <div class="mt-1">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-100">
                Teacher
              </span>
            </div>
          </div>
        </div>

        <!-- Pricing Pill -->
        <div class="flex-shrink-0 self-start">
          <div class="px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs sm:text-sm font-semibold tracking-tight shadow-sm text-right whitespace-nowrap">
            INR 5000 <span class="text-emerald-600/80 font-medium text-[11px] block sm:inline">(Per month)</span>
          </div>
        </div>
      </div>

      <!-- Attributes / Highlights Badges -->
      <div class="flex flex-wrap gap-2 pt-0.5">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-50 text-sky-800 text-xs font-medium border border-sky-100">
          <svg class="w-3.5 h-3.5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Online
        </span>

        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-800 text-xs font-medium border border-indigo-100">
          <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          Grades 8–10
        </span>

        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 text-xs font-medium border border-slate-200">
          <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
          B Tech
        </span>

        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-50 text-blue-800 text-xs font-medium border border-blue-100">
          <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          13 Yrs Exp
        </span>
      </div>

      <!-- Academic Curriculum Details Box -->
      <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200/80 flex flex-col gap-2.5 text-xs sm:text-sm">
        <div class="flex items-start gap-2.5">
          <span class="text-blue-600 mt-0.5 flex-shrink-0" title="Subjects">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </span>
          <div class="leading-relaxed">
            <strong class="font-semibold text-slate-800">Subject:</strong> 
            <span class="text-slate-600 ml-1">Mathematics, Science (General)</span>
          </div>
        </div>

        <div class="flex items-start gap-2.5 border-t border-slate-200/60 pt-2">
          <span class="text-blue-600 mt-0.5 flex-shrink-0" title="Boards">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </span>
          <div class="leading-relaxed">
            <strong class="font-semibold text-slate-800">Board:</strong> 
            <span class="text-slate-600 ml-1">CBSE, ICSE, IGCSE, IB, State</span>
          </div>
        </div>
      </div>

      <!-- Contact CTA -->
      <a 
        href="https://wa.me/" 
        target="_blank" 
        rel="noopener noreferrer"
        class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-medium text-sm sm:text-base rounded-xl shadow-sm hover:shadow transition-all"
      >
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.586-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.074-1.809-.413-1.428-.592-2.348-2.043-2.42-2.138-.071-.096-.583-.775-.583-1.479 0-.703.368-1.05.501-1.192.133-.142.29-.177.387-.177.097 0 .193.002.277.006.089.004.208-.034.324.246.121.29.414 1.01.45 1.082.036.072.06.157.012.253-.048.096-.072.156-.144.241-.072.085-.152.189-.217.254-.072.072-.148.151-.064.295.084.145.374.617.803.998.552.49 1.017.641 1.161.713.144.072.229.06.314-.037.085-.096.362-.422.458-.567.097-.145.193-.12.325-.072.133.048.844.398.989.47.145.072.241.108.277.169.036.06.036.35-.108.755zM12 2C6.477 2 2 6.477 2 12c0 1.826.49 3.538 1.343 5.013L2 22l5.127-1.343A9.957 9.957 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18.167c-1.597 0-3.085-.468-4.34-1.277l-.311-.199-3.04.797.81-2.96-.219-.348A8.127 8.127 0 013.833 12c0-4.503 3.664-8.167 8.167-8.167 4.503 0 8.167 3.664 8.167 8.167 0 4.503-3.664 8.167-8.167 8.167z"/>
        </svg>
        <span>Contact via WhatsApp</span>
      </a>
    </article>
  </main>

  <!-- Bottom Navigation Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200/90 shadow-[0_-2px_10px_rgba(0,0,0,0.03)] pb-[env(safe-area-inset-bottom,0px)]">
    <div class="max-w-md mx-auto grid grid-cols-3 h-16 items-center px-4">
      
      <!-- Enquiries Tab -->
      <button class="flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-emerald-600 transition-colors group">
        <div class="relative w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-slate-50">
          <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <span class="text-[11px] font-medium tracking-tight">Enquiries</span>
      </button>

      <!-- Profile Tab -->
      <button class="flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-amber-600 transition-colors group">
        <div class="relative w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-slate-50">
          <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
          </svg>
        </div>
        <span class="text-[11px] font-medium tracking-tight">Profile</span>
      </button>

      <!-- Find Tutor Tab (Active) -->
      <button class="flex flex-col items-center justify-center gap-1 text-blue-600 group">
        <div class="relative w-9 h-7 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <span class="text-[11px] font-bold tracking-tight">Find Tutor</span>
      </button>

    </div>
  </nav>

</body>
</html>
